name: ai-marketing-agent

# FASE 1 — Infraestructura local: n8n (2.x, Task Runners en modo external) + PostgreSQL 17
# (pgvector precargado pero sin activar) + storage compartido.
#
# El túnel público (Cloudflare Tunnel) se añade en la Fase 3, cuando se conecta Telegram.
# No hace falta para levantar y usar el editor de n8n en local.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aima-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-n8n}
      POSTGRES_USER: ${DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432" # solo para inspeccionar con un cliente SQL local; no exponer en VPS.
      # 5433 (no 5432) porque este equipo ya tiene un PostgreSQL nativo de Windows escuchando en 5432;
      # dentro de la red de Docker, n8n sigue conectándose a "postgres:5432" sin cambios.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.39.9
    container_name: aima-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      # Base de datos de n8n
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA:-public}
      # Núcleo
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_RESTRICT_FILE_ACCESS_TO: /data/storage
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false} # poner true solo cuando N8N_PROTOCOL=https real
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      TZ: ${GENERIC_TIMEZONE:-America/Bogota}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Task Runners en modo external (recomendado por n8n para cualquier despliegue con credenciales reales)
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_TIMEOUT: "300" # fijado explícito: el default bajará a 60s en una versión futura
      # Fijar explícito para no depender de defaults que n8n avisa que van a cambiar más adelante
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./storage:/data/storage
      - ./workflows:/data/workflows
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aima-cloudflared
    restart: unless-stopped
    depends_on:
      - n8n
    command: tunnel --no-autoupdate --url http://n8n:5678
    # Quick Tunnel gratuito, sin cuenta: genera una URL *.trycloudflare.com aleatoria en cada
    # arranque (ver docs/00_FASE0_ARQUITECTURA.md, sección 12). Suficiente para Fase 3 (Telegram);
    # antes de Fase 6 (Meta) se reemplaza por un Named Tunnel con dominio propio.

  n8n-runners:
    image: n8nio/runners:2.39.9 # debe coincidir EXACTO con la versión de n8nio/n8n de arriba
    container_name: aima-n8n-runners
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_MAX_CONCURRENCY: "5"

volumes:
  postgres_data:
  n8n_data:
