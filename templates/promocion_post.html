<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .canvas {
    position: relative;
    width: 100%; height: 100%;
    background-color: {{COLOR_PRIMARY}};
    background-image: {{PHOTO_BACKGROUND_CSS}};
    background-size: cover;
    background-position: center;
  }
  .overlay {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 62%;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 22%, rgba(0,0,0,0.86) 100%);
  }
  .logo-badge {
    position: absolute; top: 40px; left: 40px;
    background: {{LOGO_BADGE_BG}};
    border-radius: 16px;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img { height: 48px; display: block; }
  .company-name-badge { font-size: 22px; font-weight: 700; color: {{LOGO_BADGE_TEXT_COLOR}}; }
  .content {
    position: absolute; left: 56px; right: 56px; bottom: 48px;
    color: #ffffff;
  }
  .headline {
    font-size: 58px; font-weight: 800; line-height: 1.08;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    margin-bottom: 22px;
  }
  .bullets { list-style: none; margin-bottom: 30px; }
  .bullets li {
    font-size: 30px; font-weight: 600; line-height: 1.7;
    padding-left: 40px;
    position: relative;
  }
  .bullets li::before {
    content: "✓";
    position: absolute; left: 0; top: 0;
    color: {{COLOR_SECONDARY}};
    font-weight: 900;
  }
  .cta-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: {{COLOR_SECONDARY}};
    border-radius: 16px;
    padding: 22px 32px;
    margin-top: 8px;
  }
  .cta-text { font-size: 30px; font-weight: 800; color: #1a1a1a; }
  .cta-phone { font-size: 30px; font-weight: 800; color: #1a1a1a; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="overlay"></div>
    <div class="logo-badge">
      {{LOGO_IMG_TAG}}
    </div>
    <div class="content">
      <div class="headline">{{HEADLINE}}</div>
      <ul class="bullets">{{BULLETS_HTML}}</ul>
      <div class="cta-bar">
        <span class="cta-text">{{CTA}}</span>
        <span class="cta-phone">{{PHONE}}</span>
      </div>
    </div>
  </div>
</body>
</html>
