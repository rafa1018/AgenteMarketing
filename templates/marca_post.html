<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .canvas {
    position: relative;
    width: 100%; height: 100%;
    background-color: {{COLOR_PRIMARY}};
    background-image: {{PHOTO_BACKGROUND_CSS}};
    background-size: cover;
    background-position: center;
  }
  .tint {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, {{COLOR_PRIMARY}}E6 0%, {{COLOR_PRIMARY}}99 35%, rgba(0,0,0,0.15) 70%, rgba(0,0,0,0.05) 100%);
  }
  .logo-badge {
    position: absolute; top: 40px; left: 40px;
    background: {{LOGO_BADGE_BG}};
    border-radius: 16px;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img { height: 48px; display: block; }
  .company-name-badge { font-size: 22px; font-weight: 700; color: {{LOGO_BADGE_TEXT_COLOR}}; }
  .headline {
    position: absolute; top: 190px; left: 56px; right: 56px;
    color: #ffffff;
    font-size: 62px; font-weight: 800; line-height: 1.1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }
  .feature-rows {
    position: absolute; left: 56px; right: 56px; bottom: 220px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .feature-row {
    display: flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    padding: 16px 26px;
    backdrop-filter: blur(2px);
  }
  .feature-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: {{COLOR_SECONDARY}};
    flex-shrink: 0;
  }
  .feature-text { color: #ffffff; font-size: 27px; font-weight: 700; }
  .cta-bar {
    position: absolute; left: 56px; right: 56px; bottom: 56px;
    display: flex; align-items: center; justify-content: space-between;
    background: {{COLOR_SECONDARY}};
    border-radius: 16px;
    padding: 22px 32px;
  }
  .cta-text { font-size: 30px; font-weight: 800; color: #1a1a1a; }
  .cta-phone { font-size: 30px; font-weight: 800; color: #1a1a1a; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="tint"></div>
    <div class="logo-badge">
      {{LOGO_IMG_TAG}}
    </div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="feature-rows">{{FEATURE_ROWS_HTML}}</div>
    <div class="cta-bar">
      <span class="cta-text">{{CTA}}</span>
      <span class="cta-phone">{{PHONE}}</span>
    </div>
  </div>
</body>
</html>
