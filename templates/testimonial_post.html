<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .canvas {
    position: relative;
    width: 100%; height: 100%;
    background-color: {{COLOR_PRIMARY}};
    background-image: {{PHOTO_BACKGROUND_CSS}};
    background-size: cover;
    background-position: center;
  }
  .tint {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, {{COLOR_PRIMARY}}F0 0%, {{COLOR_PRIMARY}}E6 55%, {{COLOR_PRIMARY}}F5 100%);
  }
  .logo-badge {
    position: absolute; top: 40px; left: 40px;
    background: {{LOGO_BADGE_BG}};
    border-radius: 16px;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img { height: 48px; display: block; }
  .company-name-badge { font-size: 22px; font-weight: 700; color: {{LOGO_BADGE_TEXT_COLOR}}; }
  .quote-mark {
    position: absolute; top: 170px; left: 0; right: 0;
    text-align: center;
    font-size: 160px; font-weight: 800; line-height: 1;
    color: {{COLOR_SECONDARY}};
    font-family: Georgia, 'Times New Roman', serif;
  }
  .quote-text {
    position: absolute; top: 340px; left: 100px; right: 100px;
    text-align: center;
    color: #ffffff;
    font-size: 42px; font-weight: 700; line-height: 1.35;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  .attribution {
    position: absolute; bottom: 220px; left: 100px; right: 100px;
    text-align: center;
    color: {{COLOR_SECONDARY}};
    font-size: 26px; font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .cta-bar {
    position: absolute; left: 56px; right: 56px; bottom: 56px;
    display: flex; align-items: center; justify-content: space-between;
    background: {{COLOR_SECONDARY}};
    border-radius: 16px;
    padding: 22px 32px;
  }
  .cta-text { font-size: 28px; font-weight: 800; color: #1a1a1a; }
  .cta-phone { font-size: 28px; font-weight: 800; color: #1a1a1a; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="tint"></div>
    <div class="logo-badge">
      {{LOGO_IMG_TAG}}
    </div>
    <div class="quote-mark">&#8220;</div>
    <div class="quote-text">{{HEADLINE}}</div>
    <div class="attribution">{{CTA}}</div>
    <div class="cta-bar">
      <span class="cta-text">Contactanos</span>
      <span class="cta-phone">{{PHONE}}</span>
    </div>
  </div>
</body>
</html>
