<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .canvas {
    position: relative;
    width: 100%; height: 100%;
    background-color: {{COLOR_PRIMARY}};
    display: flex;
  }
  .panel {
    width: 46%; height: 100%;
    padding: 48px 44px;
    display: flex; flex-direction: column;
    color: #ffffff;
  }
  .logo-badge {
    background: {{LOGO_BADGE_BG}};
    border-radius: 14px;
    padding: 12px 18px;
    display: inline-flex; align-items: center; gap: 10px;
    align-self: flex-start;
    margin-bottom: 40px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img { height: 40px; display: block; }
  .company-name-badge { font-size: 18px; font-weight: 700; color: {{LOGO_BADGE_TEXT_COLOR}}; }
  .headline {
    font-size: 46px; font-weight: 800; line-height: 1.12;
    margin-bottom: 20px;
  }
  .bullets { list-style: none; margin-bottom: auto; margin-top: 6px; }
  .bullets li {
    font-size: 26px; font-weight: 600; line-height: 1.9;
    padding-left: 36px;
    position: relative;
  }
  .bullets li::before {
    content: "✓";
    position: absolute; left: 0; top: 0;
    color: {{COLOR_SECONDARY}};
    font-weight: 900;
  }
  .cta-bar {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 24px;
  }
  .cta-button {
    display: inline-block;
    background: {{COLOR_SECONDARY}};
    color: #1a1a1a;
    font-size: 22px; font-weight: 800;
    padding: 16px 28px;
    border-radius: 999px;
    align-self: flex-start;
  }
  .cta-phone { font-size: 24px; font-weight: 700; }
  .photo-side {
    width: 54%; height: 100%;
    background-image: {{MAIN_PHOTO_CSS}};
    background-size: cover;
    background-position: center;
    background-color: rgba(255,255,255,0.12);
  }
  .photo-fade {
    position: absolute; top: 0; bottom: 0;
    left: 38%; width: 220px;
    background: linear-gradient(90deg, {{COLOR_PRIMARY}} 0%, {{COLOR_PRIMARY}}00 100%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="panel">
      <div class="logo-badge">
        {{LOGO_IMG_TAG}}
      </div>
      <div class="headline">{{HEADLINE}}</div>
      <ul class="bullets">{{BULLETS_HTML}}</ul>
      <div class="cta-bar">
        <span class="cta-button">{{CTA}}</span>
        <span class="cta-phone">{{PHONE}}</span>
      </div>
    </div>
    <div class="photo-side"></div>
    <div class="photo-fade"></div>
  </div>
</body>
</html>
