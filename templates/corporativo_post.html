<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .canvas {
    position: relative;
    width: 100%; height: 100%;
    background-color: #ffffff;
    display: flex; flex-direction: column;
  }
  .hero {
    position: relative;
    width: 100%; height: 560px;
    background-color: {{COLOR_PRIMARY}};
    background-image: {{PHOTO_BACKGROUND_CSS}};
    background-size: cover;
    background-position: center;
  }
  .hero-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, {{COLOR_PRIMARY}}F0 0%, {{COLOR_PRIMARY}}C0 42%, {{COLOR_PRIMARY}}00 68%);
  }
  .hero-fade-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
    background: linear-gradient(180deg, {{COLOR_PRIMARY}}00 0%, #ffffff 100%);
  }
  .logo-badge {
    position: absolute; top: 36px; left: 36px;
    background: {{LOGO_BADGE_BG}};
    border-radius: 14px;
    padding: 12px 18px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img { height: 40px; display: block; }
  .company-name-badge { font-size: 18px; font-weight: 700; color: {{LOGO_BADGE_TEXT_COLOR}}; }
  .hero-text {
    position: absolute; left: 40px; right: 320px; top: 130px;
    color: #ffffff;
  }
  .hero-headline {
    font-size: 46px; font-weight: 800; line-height: 1.14;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    margin-bottom: 14px;
  }
  .hero-cta {
    font-size: 20px; font-weight: 700; color: {{COLOR_SECONDARY}};
    letter-spacing: 0.3px;
  }
  .badges-row {
    display: flex; justify-content: space-between;
    padding: 26px 40px 14px 40px;
    gap: 14px;
  }
  .badge {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    gap: 8px;
  }
  .badge-circle {
    width: 56px; height: 56px; border-radius: 50%;
    background: {{COLOR_PRIMARY}};
    color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
  }
  .badge-label {
    font-size: 16px; font-weight: 700; color: #1a1a1a;
    line-height: 1.25;
  }
  .photo-strip {
    display: flex; gap: 6px;
    padding: 8px 40px;
    height: 230px;
  }
  .photo-tile {
    position: relative;
    flex: 1;
    border-radius: 10px;
    overflow: hidden;
    background-color: {{COLOR_PRIMARY}};
    background-image: {{PHOTO_BACKGROUND_CSS}};
    background-size: cover;
  }
  .photo-tile:nth-child(1) { background-position: left center; }
  .photo-tile:nth-child(2) { background-position: center; }
  .photo-tile:nth-child(3) { background-position: right center; }
  .photo-tile-label {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 100%);
    color: #ffffff;
    font-size: 15px; font-weight: 700;
    text-align: center;
    padding: 26px 6px 10px 6px;
  }
  .cta-bar {
    margin: auto 40px 32px 40px;
    display: flex; align-items: center; justify-content: space-between;
    background: {{COLOR_SECONDARY}};
    border-radius: 16px;
    padding: 20px 30px;
  }
  .cta-text { font-size: 26px; font-weight: 800; color: #1a1a1a; }
  .cta-phone { font-size: 26px; font-weight: 800; color: #1a1a1a; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="hero">
      <div class="hero-scrim"></div>
      <div class="logo-badge">
        {{LOGO_IMG_TAG}}
      </div>
      <div class="hero-text">
        <div class="hero-headline">{{HEADLINE}}</div>
        <div class="hero-cta">{{CTA}}</div>
      </div>
      <div class="hero-fade-bottom"></div>
    </div>
    <div class="badges-row">{{BADGES_HTML}}</div>
    <div class="photo-strip">{{PHOTO_TILES_HTML}}</div>
    <div class="cta-bar">
      <span class="cta-text">Contactanos</span>
      <span class="cta-phone">{{PHONE}}</span>
    </div>
  </div>
</body>
</html>
