<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .canvas {
    position: relative;
    width: 100%; height: 100%;
    background-color: #ffffff;
  }
  .blob {
    position: absolute; top: 0; left: 0;
    width: 720px; height: 760px;
    background: {{COLOR_PRIMARY}};
    border-radius: 0 40% 55% 0 / 0 30% 75% 0;
  }
  .photo-side {
    position: absolute; top: 0; right: 0;
    width: 480px; height: 720px;
    background-color: {{COLOR_PRIMARY}};
    background-image: {{PHOTO_BACKGROUND_CSS}};
    background-size: cover;
    background-position: center;
    border-radius: 0 0 0 60px;
  }
  .logo-badge {
    position: absolute; top: 40px; left: 40px;
    background: {{LOGO_BADGE_BG}};
    border-radius: 14px;
    padding: 12px 18px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img { height: 40px; display: block; }
  .company-name-badge { font-size: 18px; font-weight: 700; color: {{LOGO_BADGE_TEXT_COLOR}}; }
  .headline {
    position: absolute; top: 170px; left: 56px; width: 560px;
    color: #ffffff;
    font-size: 52px; font-weight: 800; line-height: 1.15;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .cta-pill {
    position: absolute; top: 460px; left: 56px;
    display: inline-block;
    background: {{COLOR_SECONDARY}};
    color: #1a1a1a;
    font-size: 22px; font-weight: 800;
    padding: 16px 32px;
    border-radius: 999px;
  }
  .promo-badge {
    position: absolute; top: 620px; left: 480px;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: {{COLOR_SECONDARY}};
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    color: #1a1a1a;
  }
  .promo-badge-title { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .promo-badge-sub { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .phone-row {
    position: absolute; left: 56px; bottom: 60px;
    display: flex; align-items: center; gap: 16px;
  }
  .phone-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: {{COLOR_PRIMARY}};
    color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .phone-text-label { font-size: 16px; color: #555; font-weight: 600; }
  .phone-text-number { font-size: 26px; color: #1a1a1a; font-weight: 800; }
  .services-block {
    position: absolute; right: 56px; bottom: 56px; width: 460px;
  }
  .services-title {
    font-size: 26px; font-weight: 800; color: #1a1a1a; margin-bottom: 14px;
  }
  .services-title span { color: {{COLOR_PRIMARY}}; }
  .services-list {
    list-style: none;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px;
  }
  .services-list li {
    font-size: 18px; font-weight: 600; color: #333;
    padding-left: 28px; position: relative;
  }
  .services-list li::before {
    content: "✓";
    position: absolute; left: 0; top: 0;
    color: {{COLOR_PRIMARY}};
    font-weight: 900;
  }
  .bottom-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
    background: {{COLOR_SECONDARY}};
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="blob"></div>
    <div class="photo-side"></div>
    <div class="logo-badge">
      {{LOGO_IMG_TAG}}
    </div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="cta-pill">{{CTA}}</div>
    {{PROMO_BADGE_HTML}}
    <div class="phone-row">
      <div class="phone-icon">&#9742;</div>
      <div>
        <div class="phone-text-label">Contactanos</div>
        <div class="phone-text-number">{{PHONE}}</div>
      </div>
    </div>
    <div class="services-block">
      <div class="services-title">Nuestros <span>Servicios</span></div>
      <ul class="services-list">{{SERVICES_LIST_HTML}}</ul>
    </div>
    <div class="bottom-bar"></div>
  </div>
</body>
</html>
