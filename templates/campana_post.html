<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .canvas {
    position: relative;
    width: 100%; height: 100%;
    background-color: {{COLOR_PRIMARY}};
    background-image: {{PHOTO_BACKGROUND_CSS}};
    background-size: cover;
    background-position: center;
  }
  .top-fade {
    position: absolute; top: 0; left: 0; right: 0; height: 640px;
    background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 55%);
  }
  .bottom-panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 440px;
    background: {{COLOR_PRIMARY}};
  }
  .diagonal-stripe {
    position: absolute; left: -60px; bottom: 385px;
    width: 900px; height: 60px;
    background: {{COLOR_SECONDARY}};
    transform: rotate(-4deg);
    transform-origin: left center;
  }
  .logo-badge {
    position: absolute; top: 40px; left: 40px;
    background: {{LOGO_BADGE_BG}};
    border-radius: 14px;
    padding: 12px 18px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img { height: 44px; display: block; }
  .headline {
    position: absolute; left: 56px; right: 56px; bottom: 300px;
    color: #ffffff;
    font-size: 56px; font-weight: 900; line-height: 1.08;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .headline .accent { color: {{COLOR_SECONDARY}}; }
  .subline {
    position: absolute; left: 56px; right: 56px; bottom: 250px;
    color: #ffffff;
    font-size: 22px; font-weight: 600;
    opacity: 0.95;
  }
  .subline .dot { color: {{COLOR_SECONDARY}}; margin: 0 10px; }
  .badges-row {
    position: absolute; left: 56px; right: 56px; bottom: 130px;
    display: flex; justify-content: space-between;
    gap: 12px;
  }
  .badge {
    flex: 1;
    display: flex; align-items: center; gap: 10px;
  }
  .badge-circle {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid {{COLOR_SECONDARY}};
    color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
    flex-shrink: 0;
  }
  .badge-label {
    font-size: 15px; font-weight: 700; color: #ffffff;
    line-height: 1.2;
  }
  .cta-button {
    position: absolute; left: 56px; bottom: 48px;
    display: inline-flex; align-items: center; gap: 12px;
    background: {{COLOR_SECONDARY}};
    color: #1a1a1a;
    font-size: 26px; font-weight: 800;
    padding: 20px 34px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top-fade"></div>
    <div class="logo-badge">
      {{LOGO_IMG_TAG}}
    </div>
    <div class="bottom-panel"></div>
    <div class="diagonal-stripe"></div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="subline">{{SUBLINE_HTML}}</div>
    <div class="badges-row">{{BADGES_ROW_HTML}}</div>
    <div class="cta-button">{{CTA}} &#8594;</div>
  </div>
</body>
</html>
